{% extends "base.html" %}
{% block title %}注册 · 决策器{% endblock %}
{% block subtitle %}创建一个账号{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>注册</h1>
  <p class="muted">密码至少 6 位。以后换设备登录同一个邮箱，账本会跟着走。</p>
  <form method="post" action="{{ url_for('register') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>
      邮箱
      <input type="email" name="email" required autocomplete="username">
    </label>
    <label>
      密码
      <input type="password" name="password" required minlength="6" autocomplete="new-password">
    </label>
    <label>
      再输一次密码
      <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
    </label>
    <button type="submit" class="btn btn-primary">创建账号</button>
  </form>
  <p class="muted center">已有账号？<a href="{{ url_for('login') }}">登录</a></p>
</section>
{% endblock %}
